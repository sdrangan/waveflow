<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>Dividing a large product: C (M × N) is covered in tiles of Mmax × Nmax; tile C(i, j) is the sum over panels p of A(i, p) · B(p, j), where A(i, p) is the Mmax × Kmax block of row tile i and panel p, and B(p, j) the Kmax × Nmax block of panel p and column tile j. Each tile is one engine command of K / Kmax panels.</title>
  <rect x="0" y="0" width="860" height="430" fill="#ffffff"/>
  <!-- A: M x K = 3 row tiles x 4 panels, cells 36 wide x 32 tall; row i = 1 highlighted -->
  <g stroke="#2f5d8a" stroke-width="1.4" fill="#f4f7fb">
    <rect x="40" y="150" width="36" height="32"/><rect x="76" y="150" width="36" height="32"/><rect x="112" y="150" width="36" height="32"/><rect x="148" y="150" width="36" height="32"/>
    <rect x="40" y="214" width="36" height="32"/><rect x="76" y="214" width="36" height="32"/><rect x="112" y="214" width="36" height="32"/><rect x="148" y="214" width="36" height="32"/>
  </g>
  <g stroke="#2f5d8a" stroke-width="1.8" fill="#cfe0f1">
    <rect x="40" y="182" width="36" height="32"/><rect x="76" y="182" width="36" height="32"/><rect x="112" y="182" width="36" height="32"/><rect x="148" y="182" width="36" height="32"/>
  </g>
  <!-- B: K x N = 4 panels x 3 column tiles, cells 54 wide x 32 tall; column j = 2 highlighted -->
  <g stroke="#2f5d8a" stroke-width="1.4" fill="#f4f7fb">
    <rect x="290" y="40" width="54" height="32"/><rect x="344" y="40" width="54" height="32"/>
    <rect x="290" y="72" width="54" height="32"/><rect x="344" y="72" width="54" height="32"/>
    <rect x="290" y="104" width="54" height="32"/><rect x="344" y="104" width="54" height="32"/>
    <rect x="290" y="136" width="54" height="32"/><rect x="344" y="136" width="54" height="32"/>
  </g>
  <g stroke="#2f5d8a" stroke-width="1.8" fill="#cfe0f1">
    <rect x="398" y="40" width="54" height="32"/><rect x="398" y="72" width="54" height="32"/><rect x="398" y="104" width="54" height="32"/><rect x="398" y="136" width="54" height="32"/>
  </g>
  <!-- C: M x N = 3 x 3 tiles, cells 54 x 32; tile (1, 2) highlighted -->
  <g stroke="#a8641c" stroke-width="1.4" fill="#fdf6ec">
    <rect x="560" y="150" width="54" height="32"/><rect x="614" y="150" width="54" height="32"/><rect x="668" y="150" width="54" height="32"/>
    <rect x="560" y="182" width="54" height="32"/><rect x="614" y="182" width="54" height="32"/>
    <rect x="560" y="214" width="54" height="32"/><rect x="614" y="214" width="54" height="32"/><rect x="668" y="214" width="54" height="32"/>
  </g>
  <rect x="668" y="182" width="54" height="32" fill="#f6c88f" stroke="#a8641c" stroke-width="2"/>
  <g fill="#1f3550" text-anchor="middle" font-size="12">
    <text x="58" y="202">A(i,0)</text><text x="94" y="202">A(i,1)</text><text x="130" y="202">A(i,2)</text><text x="166" y="202">A(i,3)</text>
    <text x="425" y="60">B(0,j)</text><text x="425" y="92">B(1,j)</text><text x="425" y="124">B(2,j)</text><text x="425" y="156">B(3,j)</text>
    <text x="695" y="202">C(i,j)</text>
  </g>
  <g fill="#1f3550" font-size="28" text-anchor="middle">
    <text x="232" y="206">·</text>
    <text x="510" y="208">=</text>
  </g>
  <!-- labels -->
  <g fill="#3a4a5a" font-size="13" text-anchor="middle">
    <text x="112" y="140">K: P = K/Kmax panels</text>
    <text x="22" y="202">M</text>
    <text x="371" y="30">N: column tiles j</text>
    <text x="641" y="140">N</text>
    <text x="545" y="202">M</text>
    <text x="112" y="268">row tile i</text>
    <text x="425" y="186">column tile j</text>
  </g>
  <text x="430" y="300" text-anchor="middle" fill="#1f3550" font-size="17">C(i,j) = q( Σₚ A(i,p) · B(p,j) )    -- one engine command of P panels</text>
  <g fill="#3a4a5a" font-size="13">
    <text x="60" y="340">for each row tile i, for each column tile j:     the sequencer sends the feeder one descriptor</text>
    <text x="92" y="362">for each panel p:   the feeder reads A(i,p), then B(p,j) -- one burst each</text>
    <text x="92" y="384">the engine sums the panels on chip, rounds once; the writer writes C(i,j), one burst</text>
    <text x="60" y="412">A is read N/Nmax times (once per column tile), B M/Mmax times (once per row tile); C written once</text>
  </g>
</svg>
