# The stream_inband frame: one architecture an AI can be asked to build in.
#
# A frame is a bundle with no code of its own -- this file, frame.md (the
# specification), process.md (the ordered steps, also written as AGENTS.md by
# the scaffold) and prompts/ (example function specs).  Every tool that reads
# frames is frame-agnostic; adding one is adding a directory.

name = "stream_inband"
synopsis = """A host-launched streaming accelerator: parameters in a VitisRegMap, \
ap_start, then a persistent loop over in-band DATA commands that ends on END, \
halting with halted/error/tx_id on a framing or parameter error.  Each \
transaction answers with a response header, the data burst, and a footer \
carrying its per-transaction results.  Verified against an independent oracle, \
against csim/cosim, and on cycle count against the pysim timing model."""

# The example this frame is modeled on.  An agent should read it first; every
# departure from it is a likely failure point.
reference_examples = ["stream_inband"]

# The architecture, in the terms `waveflow_find_usage` will answer for.
module_kind = "HostActivated"
testbench_kind = "SeqTB"
control = "in-band command header on the input stream"
parameters = "VitisRegMap"

[docs]
specification = "frame.md"
process = "process.md"
prompts = "prompts"

[[prompts]]
file = "01_gain_clip.md"
synopsis = "Gain, round, clip, count clips.  Rounding and saturation stated bit-exactly."

[[prompts]]
file = "02_fir.md"
synopsis = "FIR filter with up to 16 taps.  State, latency and streaming as measurable claims."

[[prompts]]
file = "03_cmag_peak.md"
synopsis = "Complex float magnitude with a peak search.  Tolerance-based checking; near-ties and threshold edges."

# ---------------------------------------------------------------------------
# The scaffold template
# ---------------------------------------------------------------------------
#
# `waveflow new-accel` copies the reference example out of the checkout and
# renames it, rather than copying a committed `template/` directory.  A
# committed template is a 1,300-line duplicate of `examples/stream_inband`
# that rots the first time the example changes, and this plan's first
# principle is derived, not hand-labeled.
#
# `name_token` is the identifier every name in the example is built from.  It
# is not the example's name: the example called `stream_inband` names
# everything `poly`.

[template]
source_example = "stream_inband"
name_token = "poly"

# Directories and file types of the example that are its *results*, not its
# source.  Copying a worked run into a fresh project is how someone ends up
# comparing their own design against the example's numbers.
skip_dirs = ["__pycache__", "gen", "include", "logs", "results", "vcd", "data", "src"]
skip_suffixes = [".ipynb", ".bin", ".vcd", ".json", ".csv", ".log"]

# The compute, named by anchor rather than found by pattern.
#
# The scaffold removes exactly the function and leaves everything else --
# framing, TLAST rules, error codes, the response header and footer, the
# register map, the DAG -- because those are what the frame specifies and
# what a fresh project must still get right on its own.  Cutting them out
# would make the agent reinvent the one part the reference exists to show.
#
# Anchors are literal lines, matched after stripping, and applied to the
# example's text BEFORE the rename, so they read in the example's own names.
# `{name}` in a replacement becomes the new project's name.

[[template.stub]]
file = "poly.py"
description = "the Horner evaluation in poly_eval"
start = "y = np.full(xs.shape, c[3], dtype=np.float32)"
end = "y = (y + c[k]).astype(np.float32)"
replacement = """
# TODO: your function goes here.  Identity for now, so that a fresh
# {name} project runs end to end before you have written anything.
#
# Whatever replaces this must be the same function the C++ body in
# {name}_body_impl.tpp computes, bit for bit: the same float32 operations
# in the same order.  scenarios.py computes the expected outputs with it,
# so pin it down with worked examples (values computed by hand) as well.
y = xs.copy()
"""

[[template.stub]]
file = "poly_body_impl.tpp"
description = "the Horner arithmetic in eval_poly_horner"
start = "float y = coeff[3];"
end = "y = y + coeff[0];"
replacement = """
// TODO: your function goes here.  Identity for now, so a fresh {name}
// project builds, simulates and co-simulates unmodified -- and the first
// thing you debug is your own arithmetic, not the framing around it.
// Keep each multiply and add a separate statement: an expression the
// compiler can fuse into a multiply-add no longer matches the Python model.
float y = x;
"""
