[project]
name = "waveflow"
version = "0.1.0"
description = "A Python-first hardware modeling and synthesis framework"
authors = [
    { name = "Sundeep Rangan" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "simpy>=4.1",
    "scikit-learn>=1.3",
    "mcp[cli]>=1.0",
    "openai>=1.0",
]

# Optional developer dependencies
[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
create_doc_assets = "waveflow.scripts.create_doc_assets:main"
xsim_vcd = "waveflow.scripts.xsim_vcd:main"
collect_overlay = "waveflow.scripts.collect_overlay:main"
sv_sim = "waveflow.scripts.sv_sim:main"
sv_synth = "waveflow.scripts.sv_build:run_synth"
sv_impl  = "waveflow.scripts.sv_build:run_impl"
build_lab_autograder = "waveflow.scripts.build_lab_autograder:main"
waveflow_mcp_setup = "waveflow.scripts.waveflow_mcp_setup:main"
waveflow_mcp_server = "waveflow.mcp.server:main"
build_corpus = "waveflow.mcp.build_corpus:main"
clean_examples = "waveflow.scripts.clean_examples:main"
publish_calib = "waveflow.calib.publish:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# Automatically find the waveflow package, scripts, and the examples.
# `examples*` is installed so `from examples.mem_copy... import ...` resolves from ANY working
# directory after `pip install -e` -- not only when the repo root is on sys.path.  The example
# packages have no __init__.py (PEP 420 namespace packages), so discovery needs `namespaces = true`.
# `_archive` is excluded to match the pytest ignore.
[tool.setuptools.packages.find]
include = ["waveflow*", "scripts*", "examples*"]
exclude = ["examples._archive*"]
namespaces = true

# Include non-Python files (schemas, templates, docs assets)
[tool.setuptools]
include-package-data = true

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q --ignore-glob=examples/_archive/*"
testpaths = ["tests"]
norecursedirs = [".git", ".hg", ".mypy_cache", ".nox", ".tox", ".venv", "venv", "dist", "node_modules", "{arch}", "examples/_archive"]
markers = [
    "vitis: marks tests as requiring Vitis HLS installation (slow integration tests)",
    "xsi: marks tests as requiring Vivado xsim + mingw g++ AND a prior csynth (RTL-level BFM gates)",
    "phase1: HwComponent codegen phase 14 — phase 1 (HwTestbench + extractor mode)",
    "phase2: HwComponent codegen phase 14 — phase 2 (HlsCodegenStep.is_testbench)",
    "phase3: HwComponent codegen phase 14 — phase 3 (DUT binding + dut.run)",
    "phase4: HwComponent codegen phase 14 — phase 4 (push/pop + file IO + tbutils)",
    "phase5: HwComponent codegen phase 14 — phase 5 (FunctionalVerifyStep)",
    "phase6: HwComponent codegen phase 14 — phase 6 (poly wiring + integration)",
]
