[project]
name = "waveflow"
version = "0.1.0"
description = "A Python-first hardware modeling and synthesis framework"
authors = [
    { name = "Sundeep Rangan" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "simpy>=4.1",
    "scikit-learn>=1.3",
    # Upper-bounded on purpose: waveflow.mcp imports `mcp.server.fastmcp.FastMCP`, which the 2.x
    # line removed.  Unbounded, a fresh install resolves to 2.x and every MCP entry point fails to
    # import.  Lift the bound only together with a port to the 2.x server API.
    "mcp[cli]>=1.0,<2.0",
    "openai>=1.0",
    "platformdirs>=4.0",
    # Imported at module scope by waveflow.utils.vcd / .timing (matplotlib) and
    # waveflow.utils.trace / .vcd (vcdvcd), so they are runtime requirements, not extras --
    # `import waveflow.utils.vcd` fails outright without them.
    "matplotlib>=3.7",
    "vcdvcd>=2.0",
]

# Optional developer dependencies
[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
create_doc_assets = "waveflow.scripts.create_doc_assets:main"
xsim_vcd = "waveflow.scripts.xsim_vcd:main"
collect_overlay = "waveflow.scripts.collect_overlay:main"
sv_sim = "waveflow.scripts.sv_sim:main"
test_amd_tools = "waveflow.scripts.test_amd_tools:main"
sv_synth = "waveflow.scripts.sv_build:run_synth"
sv_impl  = "waveflow.scripts.sv_build:run_impl"
build_lab_autograder = "waveflow.scripts.build_lab_autograder:main"
waveflow_mcp_setup = "waveflow.scripts.waveflow_mcp_setup:main"
waveflow_mcp_server = "waveflow.mcp.server:main"
build_corpus = "waveflow.mcp.build_corpus:main"
clean_examples = "waveflow.scripts.clean_examples:main"
publish_calib = "waveflow.calib.publish:main"
waveflow_calib = "waveflow.calib.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# Automatically find the waveflow package, scripts, and the examples.
# `examples*` is installed so `from examples.mem_copy... import ...` resolves from ANY working
# directory after `pip install -e` -- not only when the repo root is on sys.path.  The example
# packages have no __init__.py (PEP 420 namespace packages), so discovery needs `namespaces = true`.
# `_archive` is excluded to match the pytest ignore.
[tool.setuptools.packages.find]
include = ["waveflow*", "scripts*", "examples*"]
exclude = ["examples._archive*"]
namespaces = true

# Include non-Python files (schemas, templates, docs assets)
[tool.setuptools]
include-package-data = true

# The shipped calibration corpus (reference platforms) and calibration fixtures are package data —
# they must be in the wheel so a pip-installed user can resolve `zynq7020_bfm_100mhz` and recalibrate
# a new platform with no checkout.  Explicit globs so both wheel and sdist ship every file (the
# corpus includes a .csv the MANIFEST's *.json recursion would otherwise miss).
[tool.setuptools.package-data]
"waveflow.calib" = ["platforms/**", "fixtures/**"]
# The XSI harness is C++ source + the run.bat / run.sh drivers, copied into a design's xsi/
# workspace by XsiHarnessStep.  Not Python, so package discovery misses it; without this a
# pip-installed user hits "XSI harness source file not found" the first time they build a testbench.
# `rtl/**` ships the hand-written Verilog a module declares through `rtl_module()` (the memory a
# kernel cannot contain).  Same reason as the XSI harness: GenRtlStep copies it into a design's
# build tree, so without this a pip-installed user's build cannot find the file the hook names.
#
# The top-level `*.h` / `*.hpp` / `*.tpp` / `*.cpp` are the HAND-WRITTEN TASK BODIES and the C++
# support headers a build copies into a design's tree — `mem_*_task.h`, `rf_*_task.h`,
# `shot_tx_*_task.h`, `mem_lock.h`, `streamutils_hls.h`, `memmgr.hpp`, and the rest.  They are the
# other half of every hook component: the Python class names the body, and the step copies the file.
# Tracked in git since they were written, but shipped by NEITHER the package-data globs above nor
# MANIFEST.in (whose `recursive-include waveflow` covers only *.json/*.yaml/*.yml/*.txt/*.md), so a
# pip-installed non-editable waveflow had every hook component fail on a missing source file.
"waveflow.build" = ["xsi/**", "rtl/**", "*.h", "*.hpp", "*.tpp", "*.cpp"]

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q --ignore-glob=examples/_archive/*"
testpaths = ["tests"]
norecursedirs = [".git", ".hg", ".mypy_cache", ".nox", ".tox", ".venv", "venv", "dist", "node_modules", "{arch}", "examples/_archive"]
markers = [
    "vitis: marks tests as requiring Vitis HLS installation (slow integration tests)",
    "xsi: marks tests as requiring Vivado xsim + mingw g++ AND a prior csynth (RTL-level BFM gates)",
    "phase1: HwModule codegen phase 14 — phase 1 (HwTestbench + extractor mode)",
    "phase2: HwModule codegen phase 14 — phase 2 (HlsCodegenStep.is_testbench)",
    "phase3: HwModule codegen phase 14 — phase 3 (DUT binding + dut.run)",
    "phase4: HwModule codegen phase 14 — phase 4 (push/pop + file IO + tbutils)",
    "phase5: HwModule codegen phase 14 — phase 5 (FunctionalVerifyStep)",
    "phase6: HwModule codegen phase 14 — phase 6 (poly wiring + integration)",
]
